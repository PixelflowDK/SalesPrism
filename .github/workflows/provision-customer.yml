name: Provision Customer

# Sales Prism per-customer provisioning pipeline (SAD v2.7 §14, ADR-001).
# Owner: github-actions-engineer subagent. Do not add stored Azure credentials —
# OIDC workload identity federation only (federated credential:
# repo:PixelflowDK/SalesPrism:environment:production / :environment:validation).

on:
  workflow_dispatch:
    inputs:
      customer_slug:
        description: "Customer identifier — lowercase, alphanumeric + hyphens, starts with a letter, 2-20 chars (e.g. dsv)"
        required: true
        type: string
      company_name:
        description: "Company display name (e.g. DSV A/S)"
        required: true
        type: string
      azure_region:
        description: "Azure region for non-AI resources (app, networking, observability) — GDPR-approved only. AI resources (Azure OpenAI) always deploy to westeurope regardless of this choice, per ADR-001/infra/main.bicep aiRegion (hard-pinned, DataZoneStandard quota)."
        type: choice
        options:
          - westeurope
          - northeurope
        default: westeurope
      app_service_sku:
        description: "App Service Plan SKU (B1 is validation-only — never use for a production customer)"
        type: choice
        options:
          - B3
          - P1v3
          - B1
        default: B3
      ai_model_tier:
        description: "AI model tier — see ADR-001 (gpt-5.4-mini / gpt-5.4 / gpt-5.5). Professional/Enterprise are quota-gated as of 2026-07-30."
        type: choice
        options:
          - standard
          - professional
          - enterprise
        default: standard
      ai_search_sku:
        description: "Azure AI Search SKU"
        type: choice
        options:
          - basic
          - standard
        default: basic
      environment:
        description: "Deployment environment — drives the GitHub Environment approval gate and Bicep environmentTag"
        type: choice
        options:
          - production
          - validation
        default: production
      persona_system_prompt:
        description: "System prompt / persona for this customer's assistant"
        required: true
        type: string
      logo_url:
        description: "Customer logo URL for white-label theming"
        type: string
        default: ""
      theme_id:
        description: "Theme identifier (sales-coach / insightcast / custom)"
        type: string
        default: "sales-coach"

# F6 (codex-review-1 finding 6): no workflow-level id-token permission. Every
# job declares its own minimal `permissions:` block below — only
# deploy-infrastructure and configure-application perform Azure OIDC login
# and get id-token: write; all other jobs (validate, configure-dns, summary)
# get contents: read only, so a compromised/extended step in a non-Azure job
# (e.g. configure-dns, which only calls the Cloudflare API) can never mint an
# Azure OIDC token.

# One provisioning run per customer at a time — never race two runs against the same slug.
concurrency:
  group: provision-customer-${{ inputs.customer_slug }}
  cancel-in-progress: false

env:
  CF_ZONE_NAME: pixelflow.dk
  CF_API_BASE: https://api.cloudflare.com/client/v4

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — validate
  # ---------------------------------------------------------------------------
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate customer_slug format
        env:
          SLUG: ${{ inputs.customer_slug }}
        run: |
          set -euo pipefail
          if ! echo "$SLUG" | grep -qE '^[a-z][a-z0-9-]{1,19}$'; then
            echo "::error::Invalid slug '$SLUG' — must be lowercase, start with a letter, alphanumeric + hyphens only, 2-20 chars total."
            exit 1
          fi
          echo "Slug format OK: $SLUG"

      - name: Reject reserved slugs
        env:
          SLUG: ${{ inputs.customer_slug }}
        run: |
          set -euo pipefail
          RESERVED="admin api www mail test staging prod"
          for r in $RESERVED; do
            if [ "$SLUG" = "$r" ]; then
              echo "::error::Slug '$SLUG' is reserved and cannot be used as a customer identifier. Reserved: $RESERVED"
              exit 1
            fi
          done
          echo "Slug '$SLUG' is not reserved."

      - name: Validate required fields
        env:
          COMPANY_NAME: ${{ inputs.company_name }}
          PERSONA_SYSTEM_PROMPT: ${{ inputs.persona_system_prompt }}
        run: |
          set -euo pipefail
          if [ -z "$COMPANY_NAME" ]; then
            echo "::error::company_name is required and cannot be empty."
            exit 1
          fi
          if [ -z "$PERSONA_SYSTEM_PROMPT" ]; then
            echo "::error::persona_system_prompt is required and cannot be empty."
            exit 1
          fi
          echo "Required fields present."

      - name: Guard against B1 SKU in production
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          APP_SERVICE_SKU: ${{ inputs.app_service_sku }}
        run: |
          set -euo pipefail
          if [ "$ENVIRONMENT" = "production" ] && [ "$APP_SERVICE_SKU" = "B1" ]; then
            echo "::error::app_service_sku B1 is validation-only (see infra/main.bicep). Choose B3 or P1v3 for a production customer."
            exit 1
          fi

      - name: Warn on quota-gated model tier
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AI_MODEL_TIER: ${{ inputs.ai_model_tier }}
        run: |
          if [ "$ENVIRONMENT" = "production" ] && [ "$AI_MODEL_TIER" != "standard" ]; then
            echo "::warning::ai_model_tier '$AI_MODEL_TIER' is quota-gated per ADR-001 (2026-07-30) until the corresponding Azure OpenAI quota grant lands in westeurope. Deployment will proceed but model deployment may fail if quota is still zero."
          fi

  # ---------------------------------------------------------------------------
  # Job 2 — deploy-infrastructure
  # environment: gates this job behind required-reviewer approval (production).
  # The OIDC token is not issued until that approval happens.
  # ---------------------------------------------------------------------------
  deploy-infrastructure:
    name: Deploy infrastructure
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      resource_group: ${{ steps.names.outputs.resource_group }}
      app_service_name: ${{ steps.names.outputs.app_service_name }}
      key_vault_name: ${{ steps.names.outputs.key_vault_name }}
      app_service_hostname: ${{ steps.deploy.outputs.app_service_hostname }}
      verification_id: ${{ steps.deploy.outputs.verification_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute deterministic resource names
        id: names
        env:
          SLUG: ${{ inputs.customer_slug }}
        run: |
          {
            echo "resource_group=rg-azurechat-${SLUG}"
            echo "app_service_name=app-azurechat-${SLUG}"
            echo "key_vault_name=kv-azurechat-${SLUG}"
          } >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install/update Bicep CLI
        run: az bicep install && az bicep upgrade

      - name: Lint Bicep template
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Bicep what-if preview (subscription scope)
        env:
          CUSTOMER_SLUG: ${{ inputs.customer_slug }}
          COMPANY_NAME: ${{ inputs.company_name }}
          AZURE_REGION: ${{ inputs.azure_region }}
          APP_SERVICE_SKU: ${{ inputs.app_service_sku }}
          AI_MODEL_TIER: ${{ inputs.ai_model_tier }}
          AI_SEARCH_SKU: ${{ inputs.ai_search_sku }}
          ENVIRONMENT_TAG: ${{ inputs.environment }}
        run: |
          az deployment sub what-if \
            --name "provision-${CUSTOMER_SLUG}-${{ github.run_id }}" \
            --location "$AZURE_REGION" \
            --template-file infra/main.bicep \
            --parameters \
              customerSlug="$CUSTOMER_SLUG" \
              companyName="$COMPANY_NAME" \
              azureRegion="$AZURE_REGION" \
              appServiceSku="$APP_SERVICE_SKU" \
              aiModelTier="$AI_MODEL_TIER" \
              aiSearchSku="$AI_SEARCH_SKU" \
              environmentTag="$ENVIRONMENT_TAG"
        # infra/main.bicep is subscription-scoped (targetScope = 'subscription').
        # Subscription/management-group/tenant scope deployments only ever behave as
        # Incremental — Azure does not support --mode Complete at this scope (Complete
        # mode is only valid for resource-group-scoped deployments), so no --mode flag
        # is passed here or below. This satisfies "never --mode Complete" by construction.

      - name: Bicep deploy (Incremental — subscription scope has no Complete mode)
        id: deploy
        env:
          CUSTOMER_SLUG: ${{ inputs.customer_slug }}
          COMPANY_NAME: ${{ inputs.company_name }}
          AZURE_REGION: ${{ inputs.azure_region }}
          APP_SERVICE_SKU: ${{ inputs.app_service_sku }}
          AI_MODEL_TIER: ${{ inputs.ai_model_tier }}
          AI_SEARCH_SKU: ${{ inputs.ai_search_sku }}
          ENVIRONMENT_TAG: ${{ inputs.environment }}
          # Derived from the already-regex-validated slug, so not independently
          # exploitable — bound here anyway so NO `${{ }}` expansion remains inside
          # any `run:` body and the file can be audited by that rule alone.
          NAMES_RESOURCE_GROUP: ${{ steps.names.outputs.resource_group }}
          NAMES_APP_SERVICE_NAME: ${{ steps.names.outputs.app_service_name }}
        run: |
          set -euo pipefail
          az deployment sub create \
            --name "provision-${CUSTOMER_SLUG}-${{ github.run_id }}" \
            --location "$AZURE_REGION" \
            --template-file infra/main.bicep \
            --parameters \
              customerSlug="$CUSTOMER_SLUG" \
              companyName="$COMPANY_NAME" \
              azureRegion="$AZURE_REGION" \
              appServiceSku="$APP_SERVICE_SKU" \
              aiModelTier="$AI_MODEL_TIER" \
              aiSearchSku="$AI_SEARCH_SKU" \
              environmentTag="$ENVIRONMENT_TAG" \
            --output json > deployment-output.json

          RG="$NAMES_RESOURCE_GROUP"
          APP="$NAMES_APP_SERVICE_NAME"

          HOSTNAME=$(jq -r '.properties.outputs.appServiceHostname.value' deployment-output.json)
          echo "app_service_hostname=${HOSTNAME}" >> "$GITHUB_OUTPUT"

          # customDomainVerificationId is not a Bicep output — read it directly off the
          # deployed App Service so job 3 can publish the asuid TXT record.
          VERIFICATION_ID=$(az webapp show -g "$RG" -n "$APP" --query customDomainVerificationId -o tsv)
          echo "verification_id=${VERIFICATION_ID}" >> "$GITHUB_OUTPUT"

          echo "Deployed resource group: $RG"
          echo "App Service hostname: $HOSTNAME"

      # -----------------------------------------------------------------------
      # HARD GATE — Cosmos schema (SR-009 regression guard)
      #
      # A successful `az deployment sub create` proves the ARM templates applied,
      # NOT that the application's data layer exists. SR-009 is precisely that
      # gap: infra/modules/cosmos-db.bicep provisioned only the Cosmos ACCOUNT
      # for weeks. Every deployment "succeeded", the site returned HTTP 200, and
      # the data layer was entirely absent — `az cosmosdb sql database list`
      # returned `[]` and every page load logged `theme.get-failed`.
      #
      # This step re-asserts the database, both containers, their /userId
      # partition keys, their TTLs, serverless throughput and the delete lock
      # against the live account. It is deliberately placed INSIDE
      # deploy-infrastructure and not in a later job: DNS, TLS and the app build
      # are all wasted work if the data layer is missing, and a customer must
      # never reach the URL stage of provisioning on a broken foundation.
      #
      # Non-zero exit fails the job. Do not add `continue-on-error`.
      # -----------------------------------------------------------------------
      - name: Gate — Cosmos schema verification (hard fail)
        env:
          RG: ${{ steps.names.outputs.resource_group }}
          CUSTOMER_SLUG: ${{ inputs.customer_slug }}
        run: |
          set -euo pipefail
          chmod +x infra/scripts/verify-cosmos-schema.sh
          # -w is deliberately omitted here: the app has not been deployed yet at
          # this point in the pipeline, so the optional managed-identity smoke
          # check would fail for a reason unrelated to schema correctness. The
          # end-to-end data-plane proof happens in configure-application's
          # post-deployment gate instead.
          infra/scripts/verify-cosmos-schema.sh -g "$RG" -s "$CUSTOMER_SLUG"

  # ---------------------------------------------------------------------------
  # Job 3 — configure-dns
  # Cloudflare API token is an encrypted repo secret (CLOUDFLARE_DNS_TOKEN,
  # zone-scoped to pixelflow.dk) per verified platform configuration. Never echoed.
  # This job may ONLY create/update records matching *-sales360.pixelflow.dk and
  # NEVER deletes any DNS record.
  # ---------------------------------------------------------------------------
  configure-dns:
    name: Configure DNS
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # This job only calls the Cloudflare API (CLOUDFLARE_DNS_TOKEN repo secret) —
    # it never logs into Azure and must never be able to mint an OIDC token.
    permissions:
      contents: read
    outputs:
      record_base: ${{ steps.guard.outputs.record_base }}
      fqdn: ${{ steps.guard.outputs.fqdn }}
    # Bound at JOB scope rather than written to $GITHUB_ENV from a `run:` body.
    # The previous form (`echo "CF_TOKEN=${{ secrets.X }}" >> $GITHUB_ENV`) was
    # the last remaining `${{ }}` expansion inside a shell body in this file —
    # the exact shape of the C-1 injection class. A secret is set by the repo
    # owner rather than an attacker, so this was low-risk, not no-risk: a token
    # value containing a newline would have injected arbitrary environment
    # variables into every later step. Job-level `env:` is expanded by the
    # Actions runner, never by a shell, so no value can break out of its own
    # binding. GitHub masks secret values in logs automatically, which is what
    # the `::add-mask::` call was providing.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
    steps:
      - name: Verify Cloudflare token is configured
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_DNS_TOKEN is not configured. DNS cannot be provisioned." >&2
            exit 1
          fi
          echo "Cloudflare token present (value never printed)."

      - name: Guard — record name must match *-sales360 pattern
        id: guard
        env:
          SLUG: ${{ inputs.customer_slug }}
        run: |
          set -euo pipefail
          RECORD_BASE="${SLUG}-sales360"
          if ! echo "$RECORD_BASE" | grep -qE '^[a-z][a-z0-9-]{1,19}-sales360$'; then
            echo "::error::Computed DNS record name '$RECORD_BASE' does not match the required pattern ^[a-z][a-z0-9-]{1,19}-sales360\$. Refusing to touch Cloudflare DNS."
            exit 1
          fi
          echo "record_base=${RECORD_BASE}" >> "$GITHUB_OUTPUT"
          echo "fqdn=${RECORD_BASE}.${CF_ZONE_NAME}" >> "$GITHUB_OUTPUT"
          echo "DNS guard OK — will only touch ${RECORD_BASE}.${CF_ZONE_NAME} and asuid.${RECORD_BASE}.${CF_ZONE_NAME}"

      - name: Resolve Cloudflare zone id
        run: |
          set -euo pipefail
          ZONE_ID=$(curl --fail-with-body -sS -X GET "${CF_API_BASE}/zones?name=${CF_ZONE_NAME}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "::error::Could not resolve Cloudflare zone id for ${CF_ZONE_NAME}"
            exit 1
          fi
          echo "CF_ZONE_ID=${ZONE_ID}" >> "$GITHUB_ENV"

      - name: Upsert CNAME record (proxied)
        env:
          RECORD_BASE: ${{ steps.guard.outputs.record_base }}
          APP_HOSTNAME: ${{ needs.deploy-infrastructure.outputs.app_service_hostname }}
        run: |
          set -euo pipefail
          NAME="${RECORD_BASE}.${CF_ZONE_NAME}"

          # Re-assert the guard using the value actually sent to Cloudflare (defense in depth).
          echo "$NAME" | grep -qE '^[a-z][a-z0-9-]{1,19}-sales360\.pixelflow\.dk$' || { echo "::error::CNAME name '$NAME' failed the *-sales360 guard"; exit 1; }

          EXISTING_ID=$(curl --fail-with-body -sS -X GET \
            "${CF_API_BASE}/zones/${CF_ZONE_ID}/dns_records?type=CNAME&name=${NAME}" \
            -H "Authorization: Bearer ${CF_TOKEN}" | jq -r '.result[0].id // empty')

          PAYLOAD=$(jq -n --arg name "$NAME" --arg content "$APP_HOSTNAME" \
            '{type:"CNAME", name:$name, content:$content, ttl:1, proxied:true}')

          if [ -n "$EXISTING_ID" ]; then
            echo "Updating existing CNAME record $NAME ($EXISTING_ID) — never touching other records."
            curl --fail-with-body -sS -X PUT "${CF_API_BASE}/zones/${CF_ZONE_ID}/dns_records/${EXISTING_ID}" \
              -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
              --data "$PAYLOAD" > /dev/null
          else
            echo "Creating CNAME record $NAME"
            curl --fail-with-body -sS -X POST "${CF_API_BASE}/zones/${CF_ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
              --data "$PAYLOAD" > /dev/null
          fi

      - name: Upsert TXT verification record (not proxied)
        env:
          RECORD_BASE: ${{ steps.guard.outputs.record_base }}
          VERIFICATION_ID: ${{ needs.deploy-infrastructure.outputs.verification_id }}
        run: |
          set -euo pipefail
          NAME="asuid.${RECORD_BASE}.${CF_ZONE_NAME}"

          echo "$NAME" | grep -qE '^asuid\.[a-z][a-z0-9-]{1,19}-sales360\.pixelflow\.dk$' || { echo "::error::TXT name '$NAME' failed the *-sales360 guard"; exit 1; }

          EXISTING_ID=$(curl --fail-with-body -sS -X GET \
            "${CF_API_BASE}/zones/${CF_ZONE_ID}/dns_records?type=TXT&name=${NAME}" \
            -H "Authorization: Bearer ${CF_TOKEN}" | jq -r '.result[0].id // empty')

          # TXT verification records must never be proxied (CLAUDE.md gotcha).
          PAYLOAD=$(jq -n --arg name "$NAME" --arg content "$VERIFICATION_ID" \
            '{type:"TXT", name:$name, content:$content, ttl:1, proxied:false}')

          if [ -n "$EXISTING_ID" ]; then
            echo "Updating existing TXT record $NAME ($EXISTING_ID) — never touching other records."
            curl --fail-with-body -sS -X PUT "${CF_API_BASE}/zones/${CF_ZONE_ID}/dns_records/${EXISTING_ID}" \
              -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
              --data "$PAYLOAD" > /dev/null
          else
            echo "Creating TXT record $NAME"
            curl --fail-with-body -sS -X POST "${CF_API_BASE}/zones/${CF_ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
              --data "$PAYLOAD" > /dev/null
          fi

  # ---------------------------------------------------------------------------
  # Job 4 — configure-application
  # Hostname bind, TLS (Origin Certificate best-effort), app settings, build+deploy.
  # ---------------------------------------------------------------------------
  configure-application:
    name: Configure application
    needs: [deploy-infrastructure, configure-dns]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      tls_status: ${{ steps.tls.outputs.tls_status }}
      app_url: https://${{ needs.configure-dns.outputs.fqdn }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bind custom hostname
        env:
          RG: ${{ needs.deploy-infrastructure.outputs.resource_group }}
          APP: ${{ needs.deploy-infrastructure.outputs.app_service_name }}
          FQDN: ${{ needs.configure-dns.outputs.fqdn }}
        run: |
          set -euo pipefail
          az webapp config hostname add \
            --webapp-name "$APP" \
            --resource-group "$RG" \
            --hostname "$FQDN"

      - name: TLS — Cloudflare Origin Certificate (best-effort, non-blocking)
        id: tls
        env:
          RG: ${{ needs.deploy-infrastructure.outputs.resource_group }}
          APP: ${{ needs.deploy-infrastructure.outputs.app_service_name }}
          KV: ${{ needs.deploy-infrastructure.outputs.key_vault_name }}
          FQDN: ${{ needs.configure-dns.outputs.fqdn }}
          CF_ORIGIN_CA_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_CA_KEY }}
        run: |
          set -euo pipefail
          WORKDIR=$(mktemp -d)
          cleanup() { rm -rf "$WORKDIR"; }
          trap cleanup EXIT

          if [ -z "${CF_ORIGIN_CA_KEY}" ]; then
            echo "::warning::CLOUDFLARE_ORIGIN_CA_KEY is not configured. Skipping Origin Certificate generation — TLS is 'pending'. Traffic is still served: the App Service default hostname is reachable through the Cloudflare proxy (SSL mode Full), it just is not yet Full (Strict). Add the CLOUDFLARE_ORIGIN_CA_KEY secret and re-run this job to upgrade to Full (strict)."
            echo "tls_status=pending" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::add-mask::${CF_ORIGIN_CA_KEY}"

          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$WORKDIR/origin-key.pem" \
            -out "$WORKDIR/origin.csr" \
            -subj "/CN=${FQDN}" 2>/dev/null

          CSR_JSON=$(jq -Rs . < "$WORKDIR/origin.csr")
          REQUEST_BODY=$(jq -n --argjson csr "$CSR_JSON" --arg hostname "$FQDN" \
            '{hostnames: [$hostname], requested_validity: 5475, request_type: "origin-rsa", csr: $csr}')

          set +e
          RESPONSE=$(curl -sS -X POST "${CF_API_BASE}/certificates" \
            -H "X-Auth-User-Service-Key: ${CF_ORIGIN_CA_KEY}" \
            -H "Content-Type: application/json" \
            --data "$REQUEST_BODY")
          CURL_STATUS=$?
          set -e

          SUCCESS=$(echo "$RESPONSE" | jq -r '.success // false' 2>/dev/null || echo "false")
          if [ "$CURL_STATUS" -ne 0 ] || [ "$SUCCESS" != "true" ]; then
            echo "::warning::Cloudflare Origin Certificate request failed — continuing without it. TLS is 'pending'. App Service traffic is still served via the Cloudflare proxy (SSL mode Full). Response: $(echo "$RESPONSE" | jq -c '.errors // empty' 2>/dev/null)"
            echo "tls_status=pending" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$RESPONSE" | jq -r '.result.certificate' > "$WORKDIR/origin-cert.pem"

          PFX_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::${PFX_PASSWORD}"

          openssl pkcs12 -export \
            -in "$WORKDIR/origin-cert.pem" \
            -inkey "$WORKDIR/origin-key.pem" \
            -out "$WORKDIR/origin-cert.pfx" \
            -passout pass:"${PFX_PASSWORD}"

          # Escrow the PFX + password in the customer Key Vault. Best-effort: the KV has
          # publicNetworkAccess disabled (private-endpoint only, see infra/modules/key-vault.bicep)
          # so a GitHub-hosted runner cannot reach it and this is EXPECTED to fail until an
          # infra decision is made (self-hosted runner in the VNet, a temporary firewall
          # exception, or an az deployment script). The certificate is still installed and
          # bound directly below via local file upload, which does not require KV access —
          # so this failing does not block TLS from working, it only blocks long-term escrow.
          set +e
          PFX_B64=$(base64 -i "$WORKDIR/origin-cert.pfx" | tr -d '\n')
          az keyvault secret set --vault-name "$KV" --name "origin-cert-pfx-base64" --value "$PFX_B64" -o none 2>"$WORKDIR/kv-err.log"
          KV_CERT_STATUS=$?
          az keyvault secret set --vault-name "$KV" --name "origin-cert-pfx-password" --value "$PFX_PASSWORD" -o none 2>>"$WORKDIR/kv-err.log"
          KV_PASS_STATUS=$?
          set -e
          if [ "$KV_CERT_STATUS" -ne 0 ] || [ "$KV_PASS_STATUS" -ne 0 ]; then
            echo "::warning::Could not write Origin Certificate material to Key Vault '$KV' (expected if the vault's public network access is disabled and no private-endpoint-reachable runner is available). Certificate install/bind will proceed from local file. Escrow this manually or fix runner network reachability — see job summary."
          fi

          THUMBPRINT=$(az webapp config ssl upload \
            --resource-group "$RG" \
            --name "$APP" \
            --certificate-file "$WORKDIR/origin-cert.pfx" \
            --certificate-password "$PFX_PASSWORD" \
            --query thumbprint -o tsv)

          az webapp config ssl bind \
            --resource-group "$RG" \
            --name "$APP" \
            --certificate-thumbprint "$THUMBPRINT" \
            --ssl-type SNI

          echo "tls_status=installed" >> "$GITHUB_OUTPUT"

      - name: Set application settings (no secrets/keys — managed identity only)
        env:
          RG: ${{ needs.deploy-infrastructure.outputs.resource_group }}
          APP: ${{ needs.deploy-infrastructure.outputs.app_service_name }}
          AI_MODEL_TIER: ${{ inputs.ai_model_tier }}
          THEME_ID: ${{ inputs.theme_id }}
          LOGO_URL: ${{ inputs.logo_url }}
          PERSONA_SYSTEM_PROMPT: ${{ inputs.persona_system_prompt }}
          COMPANY_NAME: ${{ inputs.company_name }}
          CUSTOMER_SLUG: ${{ inputs.customer_slug }}
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --resource-group "$RG" \
            --name "$APP" \
            --settings \
              AI_MODEL_TIER="$AI_MODEL_TIER" \
              THEME_ID="$THEME_ID" \
              LOGO_URL="$LOGO_URL" \
              PERSONA_SYSTEM_PROMPT="$PERSONA_SYSTEM_PROMPT" \
              COMPANY_NAME="$COMPANY_NAME" \
              CUSTOMER_SLUG="$CUSTOMER_SLUG" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="false" \
              WEBSITE_NODE_DEFAULT_VERSION="~22" \
            -o none
          # NOTE: AZURE_OPENAI_ENDPOINT / AZURE_SEARCH_ENDPOINT / AZURE_COSMOSDB_ENDPOINT /
          # AZURE_KEYVAULT_ENDPOINT / AZURE_STORAGE_ACCOUNT_NAME / AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
          # are already populated by infra/main.bicep's app-service module at deploy time
          # (see infra/modules/app-service.bicep) — this workflow does not own infra/ and does
          # not re-set them here. USE_MANAGED_IDENTITIES=true is likewise set by Bicep. No
          # *_KEY / *_SECRET / *_CONNECTION_STRING value is ever set from this workflow.

          az webapp config set \
            --resource-group "$RG" \
            --name "$APP" \
            --startup-file "node server.js" \
            -o none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build application (Next.js standalone output)
        working-directory: src
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Package standalone build for zip deploy
        run: |
          set -euo pipefail
          rm -rf site-deploy
          mkdir -p site-deploy
          cp -R src/.next/standalone/. site-deploy/
          mkdir -p site-deploy/.next
          cp -R src/.next/static site-deploy/.next/static
          cp -R src/public site-deploy/public
          cd site-deploy
          zip -qr ../app.zip .

      - name: Deploy application code (zip)
        env:
          RG: ${{ needs.deploy-infrastructure.outputs.resource_group }}
          APP: ${{ needs.deploy-infrastructure.outputs.app_service_name }}
        run: |
          az webapp deploy \
            --resource-group "$RG" \
            --name "$APP" \
            --src-path app.zip \
            --type zip

      # -----------------------------------------------------------------------
      # HARD GATE — the live site is serving THIS run's build
      #
      # `az webapp deploy` returning 0 means the zip was accepted by Kudu. It
      # does NOT mean the worker restarted, that the new build boots, or that
      # the site is serving it. This project has twice mistaken "committed" for
      # "deployed" (18 commits sat undeployed for 11 days) and once mistaken a
      # stale service-worker cache for a live response. Every one of those was
      # a claim that no automated check could have made, because nothing ever
      # asked the running instance what it was.
      #
      # /api/health reports a commit SHA INLINED AT BUILD TIME (next.config.js
      # `env`), so it cannot be spoofed by an app setting and cannot drift from
      # the artifact. Comparing it to this run's SHA is a true end-to-end proof:
      # the response can only match if the zip built in this job is the code
      # currently executing on the worker.
      #
      # Queried over the App Service DEFAULT hostname, not the customer FQDN —
      # Cloudflare DNS/TLS may still be propagating at this point, and a
      # proxied edge could serve a cached answer. `Cache-Control: no-store` on
      # the route plus a direct-to-origin request keeps this honest.
      #
      # Non-zero exit fails the job. Do not add `continue-on-error`.
      # -----------------------------------------------------------------------
      - name: Gate — deployed build matches this run (hard fail)
        env:
          HOSTNAME: ${{ needs.deploy-infrastructure.outputs.app_service_hostname }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          EXPECTED_SHORT="${EXPECTED_SHA:0:7}"
          HEALTH_URL="https://${HOSTNAME}/api/health"
          echo "Expecting commit ${EXPECTED_SHORT} at ${HEALTH_URL}"

          # A cold Next.js standalone start after a zip deploy is routinely
          # 60-90s on B1/S1. 30 attempts x 10s = 5 minutes before giving up,
          # which is generous enough that a timeout here means a real failure
          # (crash loop, bad app setting, failed build) rather than slowness.
          ATTEMPTS=30
          for i in $(seq 1 "$ATTEMPTS"); do
            BODY=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$HEALTH_URL" 2>/dev/null || echo "")
            LIVE_SHA=$(echo "$BODY" | jq -r '.commit // empty' 2>/dev/null || echo "")

            if [ "$LIVE_SHA" = "$EXPECTED_SHORT" ]; then
              echo "PASS: live build is ${LIVE_SHA} (attempt ${i})"
              echo "$BODY"
              exit 0
            fi

            # "unknown" means the artifact was built outside CI — a real defect
            # (someone deployed a local build), never a transient state. Fail
            # immediately rather than burning five minutes on it.
            if [ "$LIVE_SHA" = "unknown" ]; then
              echo "FAIL: live site reports build SHA 'unknown' — the deployed artifact was not built by CI." >&2
              exit 1
            fi

            if [ -n "$LIVE_SHA" ]; then
              echo "attempt ${i}/${ATTEMPTS}: serving ${LIVE_SHA}, waiting for ${EXPECTED_SHORT} (old worker still up)"
            else
              echo "attempt ${i}/${ATTEMPTS}: no health response yet"
            fi
            sleep 10
          done

          echo "FAIL: after $((ATTEMPTS * 10))s the site is not serving ${EXPECTED_SHORT}." >&2
          echo "The zip deploy was accepted but the running instance never came up on the new build." >&2
          echo "Check: az webapp log tail -g <rg> -n <app>" >&2
          exit 1

      # -----------------------------------------------------------------------
      # HARD GATE — managed-identity data-plane reachability
      #
      # Complements the Cosmos SCHEMA gate in deploy-infrastructure, which can
      # only read the ARM control plane (the runner has no route into the
      # customer VNet). This one proves the path the schema gate cannot:
      # App Service managed identity -> private endpoint -> Cosmos data plane.
      #
      # It works by hitting the app's own public root URL, which runs
      # `EnsureTenantTheme` unauthenticated on every request (src/app/layout.tsx)
      # and therefore performs a real authenticated Cosmos read/write from
      # inside the VNet, then asserting no `theme.get-failed` was logged — the
      # exact signal SR-009 produced for weeks while every provisioning run
      # reported success.
      # -----------------------------------------------------------------------
      - name: Gate — managed-identity data-plane smoke test (hard fail)
        env:
          RG: ${{ needs.deploy-infrastructure.outputs.resource_group }}
          APP: ${{ needs.deploy-infrastructure.outputs.app_service_name }}
          CUSTOMER_SLUG: ${{ inputs.customer_slug }}
        run: |
          set -euo pipefail
          chmod +x infra/scripts/verify-cosmos-schema.sh
          infra/scripts/verify-cosmos-schema.sh -g "$RG" -s "$CUSTOMER_SLUG" -w "$APP"

  # ---------------------------------------------------------------------------
  # Job 5 — summary
  # ---------------------------------------------------------------------------
  summary:
    name: Provisioning summary
    needs: [deploy-infrastructure, configure-dns, configure-application]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Write summary
        env:
          RG: ${{ needs.deploy-infrastructure.outputs.resource_group }}
          FQDN: ${{ needs.configure-dns.outputs.fqdn }}
          TLS_STATUS: ${{ needs.configure-application.outputs.tls_status }}
          SUB_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          CUSTOMER_SLUG: ${{ inputs.customer_slug }}
          ENVIRONMENT: ${{ inputs.environment }}
          AI_MODEL_TIER: ${{ inputs.ai_model_tier }}
          AZURE_REGION: ${{ inputs.azure_region }}
        run: |
          {
            echo "## Sales Prism — Customer Provisioned: ${CUSTOMER_SLUG}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Customer URL | https://${FQDN:-not-configured} |"
            echo "| Resource Group | ${RG:-unknown} |"
            echo "| Azure Portal | https://portal.azure.com/#@/resource/subscriptions/${SUB_ID}/resourceGroups/${RG}/overview |"
            echo "| TLS status | ${TLS_STATUS:-unknown} (installed = Full Strict origin cert bound; pending = served via Cloudflare proxy, Full mode, no origin cert yet) |"
            echo "| Environment | ${ENVIRONMENT} |"
            echo "| AI model tier | ${AI_MODEL_TIER} |"
            echo ""
            echo "**Note:** AI resources (Azure OpenAI) always deploy to **westeurope** regardless of the azure_region input (${AZURE_REGION}) — hard-pinned in infra/main.bicep's \`aiRegion\` param per ADR-001 (DataZoneStandard quota). Only non-AI resources use azure_region."
            echo ""
            echo "### Next steps"
            echo "- DNS may take a few minutes to propagate before the custom hostname resolves everywhere."
            if [ "${TLS_STATUS:-pending}" = "pending" ]; then
              echo "- TLS is pending: add the CLOUDFLARE_ORIGIN_CA_KEY secret and re-run the configure-application job to upgrade to Full (strict)."
            fi
            echo "- Entra ID App Registration for this customer is NOT created by this workflow (see scripts/appreg_setup.sh) — run separately if required."
            echo "- Cosmos DB TenantTheme seeding is NOT performed by this workflow — Cosmos DB has publicNetworkAccess disabled (private-endpoint only), so this needs a network-reachable path (self-hosted runner in the VNet, or app-side first-run bootstrap) before it can be automated here."
            echo "- Admin registry write (customer record) is a Phase D / Admin Portal feature (SAD §15) and is not yet implemented — no admin-registry Cosmos DB resource exists in infra/ yet. Track manually until that lands."
            if [ "${AI_MODEL_TIER}" != "standard" ] && [ "${ENVIRONMENT}" = "production" ]; then
              echo "- ai_model_tier '${AI_MODEL_TIER}' is quota-gated per ADR-001 — confirm the Azure OpenAI quota grant has landed in westeurope before telling the customer it is live."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
